name: Deploy to GitHub Pages

# NOTE: This app now has a real backend (login/registration/lead-capture API
# routes + src/proxy.ts session gate — see next.config.ts). GitHub Pages only
# serves static files and cannot run any of that, so this workflow can no
# longer auto-deploy on every push — `npm run build` will fail the moment it
# hits a dynamic route handler while output:"export" is set. Left here as
# workflow_dispatch only in case a future static-only snapshot is needed;
# migrate hosting to a Node.js-capable platform (e.g. Vercel) to restore a
# working live deployment with the backend intact.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build static export
        run: npm run build
        env:
          # Must match the repository name for GitHub Pages project sites.
          NEXT_PUBLIC_BASE_PATH: /edufy-tech
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
